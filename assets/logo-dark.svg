<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowStar" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Leaf Ribbon (Stylized left bar of N) -->
  <path d="M 22 66 C 14 54 14 26 26 14 C 36 24 38 48 30 66 Z" fill="url(#leafGrad)" filter="url(#glowGreen)" />
  <!-- Central Leaf Spine detail -->
  <path d="M 22 58 C 24 45 28 32 30 22" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right Water Wave Ribbon (Stylized right bar of N) -->
  <path d="M 52 14 C 64 26 64 54 52 66 C 42 56 40 32 48 14 Z" fill="url(#waterGrad)"/>
  
  <!-- Diagonal Dynamic Flow (connecting the N) -->
  <path d="M 26 22 C 34 32 44 48 52 58 C 46 60 38 52 28 36 Z" fill="url(#leafGrad)" opacity="0.85"/>
  <path d="M 28 20 C 36 34 44 46 50 56" stroke="url(#waterGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Water Drop in bottom right curve -->
  <path d="M 64 48 C 64 43 68 37 68 37 C 68 37 72 43 72 48 C 72 52.4 68.4 56 64 56 Z" fill="#38BDF8" opacity="0.9"/>

  <!-- Center Golden Star Sparkle -->
  <g transform="translate(39, 40)" filter="url(#glowStar)">
    <!-- 4-point star -->
    <path d="M 0 -11 Q 0 -1 10 0 Q 0 1 0 11 Q 0 1 -10 0 Q 0 -1 0 -11 Z" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <text x="88" y="52" font-family="'Space Grotesk', 'Outfit', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="2" fill="#F8FAFC">
    NUTRO
  </text>
  
  <!-- Plus Symbol Badge -->
  <g transform="translate(226, 25)">
    <rect width="26" height="26" rx="7" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 13 7 L 13 19 M 7 13 L 19 13" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Tagline underneath -->
  <text x="89" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9.5" letter-spacing="3" fill="#94A3B8">
    HEALTH &amp; NUTRITION AI
  </text>
</svg>
